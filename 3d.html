function restart(){homeScore=awayScore=elapsed=0;finished=paused=halfShown=false;scoreEl.textContent='0 — 0';resetPositions(0);toast('Kick off!',1.4)}function scoreGoal(team){if(team===0)homeScore++;else awayScore++;scoreEl.textContent=`${homeScore} — ${awayScore}`;celebration=2.2;toast(team===0?'Goal for Northside!':'Goal for City Rovers!',2);resetPositions(team===0?1:0)}function nearest(list,obj,exclude){let winner=null,d=Infinity;for(const p of list){if(p===exclude)continue;const n=Math.hypot(p.x-obj.x,p.z-obj.z);if(n<d){winner=p;d=n}}return winner}
function passTarget(p,list){const dir=p.team===0?1:-1;let best=null,score=-Infinity;for(const q of list){if(q===p)continue;const dx=(q.x-p.x)*dir,dz=q.z-p.z,d=Math.hypot(dx,dz);if(dx<-.8||d>31)continue;const space=Math.min(18,...players.filter(a=>a.team!==p.team).map(a=>Math.hypot(a.x-q.x,a.z-q.z)));const value=dx*1.2+space*.7-d*.25-Math.abs(dz)*.12;if(value>score){best=q;score=value}}return best}
function kick(p,targetX,targetZ,power){const dx=targetX-p.x,dz=targetZ-p.z,d=Math.hypot(dx,dz)||1;ball.owner=null;ball.x=p.x+dx/d*.65;ball.z=p.z+dz/d*.65;ball.vx=dx/d*power;ball.vz=dz/d*power;ball.spin=0}
function action(type){if(paused||finished)return;const p=home[selected];if(!p||ball.owner!==p)return;if(type==='shoot'){kick(p,42,clamp(-p.z*.14,-3.2,3.2),22);toast('Shot!',.5)}if(type==='pass'){const q=passTarget(p,home)||nearest(home,p,p);if(q){kick(p,q.x+q.vx*.28,q.z+q.vz*.28,14);toast('Pass!',.5)}}}
function move(p,tx,tz,maxSpeed,dt){tx=clampField(tx,-41.2,41.2);tz=clampField(tz,-21.2,21.2);const dx=tx-p.x,dz=tz-p.z,d=Math.hypot(dx,dz),desired=Math.min(maxSpeed,d*2.6);let ax=(dx/(d||1))*desired-p.vx,az=(dz/(d||1))*desired-p.vz;const accel=24,a=Math.hypot(ax,az);if(a>accel){ax=ax/a*accel;az=az/a*accel}p.vx+=ax*dt;p.vz+=az*dt;p.x=clampField(p.x+p.vx*dt,-41.4,41.4);p.z=clampField(p.z+p.vz*dt,-21.6,21.6);if(Math.hypot(p.vx,p.vz)>.35)p.dir=Math.atan2(p.vx,p.vz);p.phase+=dt*Math.hypot(p.vx,p.vz)*1.8}
function shape(p,team,owner){const attack=team===0?1:-1,progress=clamp((ball.x+42)/84,0,1),shift=(progress-.5)*4.8;let x=p.homeX+shift,z=p.homeZ+(ball.z-p.homeZ)*.17;if(p.role==='keeper')return[team===0?-38:38,ball.z*.18];if(owner&&owner.team===team&&owner!==p){if(p.role==='forward'){x=owner.x+attack*(p.homeX<0?7:11);z=clampField(owner.z+(p.homeZ<0?-6:6),-18,18)}else if(p.role==='midfielder'){x=owner.x+attack*4.5;z=clampField(owner.z+(p.homeZ<0?-7:7),-18,18)}}else if(owner&&owner.team!==team){if(p.role==='defender'){x=p.homeX+shift*.2;z=p.homeZ+(owner.z-p.homeZ)*.12}else if(p.role==='midfielder'){x=p.homeX+shift*.34;z=p.homeZ+(owner.z-p.homeZ)*.23}else{x=p.homeX+attack*2;z=p.homeZ+(owner.z-p.homeZ)*.12}}return[x,z]}
function ai(team,dt){const squad=teams[team],owner=ball.owner,chaser=owner?null:nearest(squad,ball,null);for(const p of squad){if(team===0&&p===home[selected])continue;let [tx,tz]=shape(p,team,owner),speed=p.role==='keeper'?5.2:6.5;if(!owner){if(p===chaser){tx=ball.x+ball.vx*.12;tz=ball.z+ball.vz*.12;speed=8.5;p.decision='challenge'}else p.decision='recover'}else if(owner.team!==team){const marker=nearest(squad,owner,null);if(p===marker&&p.role!=='keeper'){tx=owner.x-(team===0?-.7:.7);tz=owner.z;speed=8;p.decision='press'}else p.decision='cover'}else if(owner===p){const goalX=team===0?42:-42,near=nearest(teams[1-team],p,null),goalDist=Math.abs(goalX-p.x);p.think-=dt;if(p.think<=0){p.think=.45+Math.random()*.35;p.decision=goalDist<16&&Math.abs(p.z)<12&&(!near||Math.hypot(near.x-p.x,near.z-p.z)>4.4)?'shoot':near&&Math.hypot(near.x-p.x,near.z-p.z)<3.2&&passTarget(p,squad)?'pass':'dribble'}if(p.decision==='shoot'){kick(p,goalX,clampField(-p.z*.18,-2.8,2.8),22);p.decision='shape';continue}if(p.decision==='pass'){const q=passTarget(p,squad);if(q){kick(p,q.x+q.vx*.3,q.z+q.vz*.3,14);p.decision='shape';continue}}tx=p.x+(team===0?7:-7);tz=p.z*.72;speed=6.1}else p.decision='support';for(const q of squad){if(q!==p&&!(team===0&&q===home[selected])){const dx=p.x-q.x,dz=p.z-q.z,d=Math.hypot(dx,dz);if(d>0&&d<2.1){tx+=dx/d*(2.1-d)*.75;tz+=dz/d*(2.1-d)*.75}}}move(p,tx,tz,speed,dt)}}
function update(dt,t){if(paused||finished)return;elapsed+=dt;const sec=Math.min(5400,elapsed*30);clockEl.textContent=`${String(Math.floor(sec/60)).padStart(2,'0')}:${String(Math.floor(sec%60)).padStart(2,'0')}`;if(toastTimer>0&&(toastTimer-=dt)<=0)toastEl.classList.remove('show');if(celebration>0)celebration-=dt;if(sec>=2700&&!halfShown){halfShown=true;toast('Half time',1.8)}if(sec>=5400){finished=true;ball.owner=null;toast(`Full time · Northside ${homeScore} — ${awayScore} City Rovers · Enter to restart`,5);return}
const p=home[selected],left=pressed.has('ArrowLeft')||pressed.has('KeyA'),right=pressed.has('ArrowRight')||pressed.has('KeyD'),up=pressed.has('ArrowUp')||pressed.has('KeyW'),down=pressed.has('ArrowDown')||pressed.has('KeyS'),sprint=pressed.has('ShiftLeft')||pressed.has('ShiftRight');let ix=(right?1:0)-(left?1:0),iz=(down?1:0)-(up?1:0),d=Math.hypot(ix,iz);if(d){ix/=d;iz/=d;p.dir=Math.atan2(ix,iz)}const max=sprint&&p.stamina>.05?12:8.5;p.stamina=clamp(p.stamina+(sprint&&d?-.2:.12)*dt,0,1);p.vx+=(ix*max-p.vx)*Math.min(1,dt*11);p.vz+=(iz*max-p.vz)*Math.min(1,dt*11);if(!d){p.vx*=Math.pow(.08,dt);p.vz*=Math.pow(.08,dt)}p.x=clampField(p.x+p.vx*dt,-41.4,41.4);p.z=clampField(p.z+p.vz*dt,-21.6,21.6);p.phase+=dt*Math.hypot(p.vx,p.vz)*1.8;
ai(0,dt);ai(1,dt);
if(ball.owner){const h=ball.owner;ball.x=h.x+Math.sin(h.dir)*.72;ball.z=h.z+Math.cos(h.dir)*.72;const tackler=nearest(h.team===0?away:home,ball,null);if(tackler&&Math.hypot(tackler.x-ball.x,tackler.z-ball.z)<.88&&Math.hypot(tackler.vx,tackler.vz)>1.3&&Math.random()<dt*.9){ball.owner=tackler;toast(tackler.team===0?'Won the ball!':'Ball lost!',.6)}}else{ball.x+=ball.vx*dt;ball.z+=ball.vz*dt;ball.vx*=Math.pow(.988,dt*60);ball.vz*=Math.pow(.988,dt*60);ball.spin+=dt*16;if(Math.abs(ball.z)>22){ball.z=Math.sign(ball.z)*22;ball.vz*=-.66}if(ball.x<-44||ball.x>44){if(Math.abs(ball.z)<3.7){scoreGoal(ball.x>44?0:1);return}ball.x=clampField(ball.x,-44,44);ball.vx*=-.65}}
if(!ball.owner&&Math.hypot(ball.vx,ball.vz)<17){const winner=nearest(players,ball,null);if(winner&&Math.hypot(winner.x-ball.x,winner.z-ball.z)<.95){ball.owner=winner;ball.vx=ball.vz=0;if(winner.team===0)selected=home.indexOf(winner)}}
for(const q of players){q.group.position.set(q.x,0,q.z);q.group.rotation.y=q.dir;const running=Math.hypot(q.vx,q.vz)>.8;for(const l of q.limbs){const phase=q.phase*(l.side===1?1:-1);l.legPivot.rotation.x=running?Math.sin(phase*2)*.55:0;l.armPivot.rotation.x=running?-Math.sin(phase*2)*.38:Math.sin(t*1.3+q.cloth)*.025}q.torso.scale.x=1+Math.sin(t*8+q.cloth)*Math.min(.035,Math.hypot(q.vx,q.vz)*.003)}syncBall();updateCrowd(t);if(celebration>0){for(const c of crowd){if(Math.sin(t*4+c.seed)>.93)c.pos.y+=.001}}}
function draw(){renderer.render(scene,camera)}function loop(now){const dt=Math.min(.04,(now-last)/1000||.016);last=now;const t=now/1000;update(dt,t);draw();requestAnimationFrame(loop)}
function switchPlayer(){selected=home.indexOf(nearest(home,ball,null));toast('Player '+home[selected].num,.5)}window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();if(!pressed.has(e.code)){if(e.code==='Space')action('shoot');if(e.code==='KeyE')action('pass');if(e.code==='KeyQ')switchPlayer()}if(e.code==='Escape'){paused=!paused;toast(paused?'Paused':'Resume',1)}if(e.code==='Enter'&&finished)restart();pressed.add(e.code)});window.addEventListener('keyup',e=>pressed.delete(e.code));window.addEventListener('blur',()=>pressed.clear());document.querySelector('#restart').addEventListener('click',restart);document.querySelectorAll('[data-key]').forEach(b=>{const code=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();pressed.add(code);b.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>pressed.delete(code)))});document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();action(b.dataset.action)}));window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7))});
// Place players and give Northside the kickoff possession.
resetPositions(0);updateCrowd(0);loading.classList.add('hide');setTimeout(()=>loading.remove(),500);toast('3D match ready · Northside kick off',2);requestAnimationFrame(loop);
})().catch(error=>{console.error(error);document.querySelector('#loading').innerHTML='<div class="error"><strong>Could not load the 3D match.</strong><p>This game needs a modern browser with WebGL and internet access to load the 3D engine.</p><a href="index.html">Play the 2D version instead</a></div>'});
</script></body></html>
